name: Tests
on:
  push:
    branches: [main]
    paths:
      - 'base-claude.sb'
      - 'base-common.sb'
      - 'base-codex.sb'
      - 'base-pi.sb'
      - 'base-omp.sb'
      - 'base-opencode.sb'
      - 'rollcage'
      - 'rollcage.lib.zsh'
      - 'adapters/**'
      - 'base-protections.sb'
      - 'test_dispatch.zsh'
      - 'test_protections_sandbox.zsh'
      - 'test_rollcage.bash'
      - 'test_trust_gate.zsh'
      - 'test_sandbox.zsh'
      - 'test_codex_sandbox.zsh'
      - 'test_pi_sandbox.zsh'
      - 'test_omp_sandbox.zsh'
      - 'test_opencode_sandbox.zsh'
      - 'toolchains/postgres.sb'
      - 'toolchains/postgres.test.zsh'
      - 'toolchains/metal.sb'
      - 'toolchains/metal.test.zsh'
      - 'toolchains/test_helpers.zsh'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'base-claude.sb'
      - 'base-common.sb'
      - 'base-codex.sb'
      - 'base-pi.sb'
      - 'base-omp.sb'
      - 'base-opencode.sb'
      - 'rollcage'
      - 'rollcage.lib.zsh'
      - 'adapters/**'
      - 'base-protections.sb'
      - 'test_dispatch.zsh'
      - 'test_protections_sandbox.zsh'
      - 'test_rollcage.bash'
      - 'test_trust_gate.zsh'
      - 'test_sandbox.zsh'
      - 'test_codex_sandbox.zsh'
      - 'test_pi_sandbox.zsh'
      - 'test_omp_sandbox.zsh'
      - 'test_opencode_sandbox.zsh'
      - 'toolchains/postgres.sb'
      - 'toolchains/postgres.test.zsh'
      - 'toolchains/metal.sb'
      - 'toolchains/metal.test.zsh'
      - 'toolchains/test_helpers.zsh'
      - '.github/workflows/test.yml'

jobs:
  dsl-tests:
    name: DSL pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash test_rollcage.bash

  trust-gate:
    name: Trust gate integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: zsh test_trust_gate.zsh
      - run: zsh test_dispatch.zsh

  sandbox-base:
    name: "Sandbox: base profile"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: zsh test_sandbox.zsh --toolchain none

  sandbox-codex:
    name: "Sandbox: Codex base profile"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: zsh test_codex_sandbox.zsh

  sandbox-pi:
    name: "Sandbox: Pi base profile"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: zsh test_pi_sandbox.zsh

  sandbox-omp:
    name: "Sandbox: Oh My Pi base profile"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://omp.sh/install | sh -s -- --binary
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: zsh test_omp_sandbox.zsh

  sandbox-opencode:
    name: "Sandbox: OpenCode base profile"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path
      - run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - run: zsh test_opencode_sandbox.zsh

  sandbox-postgres:
    name: "Sandbox toolchain: PostgreSQL"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install postgresql@17
      - run: zsh test_sandbox.zsh --toolchain postgres

  sandbox-metal:
    name: "Sandbox toolchain: Metal"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: zsh test_sandbox.zsh --toolchain metal

  sandbox-protections:
    name: "Sandbox: final control-file protections"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: zsh test_protections_sandbox.zsh
