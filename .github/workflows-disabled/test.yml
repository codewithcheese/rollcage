name: Tests
on:
  push:
    branches: [main]
    paths:
      - 'base.sb'
      - 'base-common.sb'
      - 'base-codex.sb'
      - 'base-pi.sb'
      - 'base-omp.sb'
      - 'base-opencode.sb'
      - 'xclaude'
      - 'xcodex'
      - 'xpi'
      - 'xomp'
      - 'xopencode'
      - 'xclaude.lib.zsh'
      - 'xcodex.lib.zsh'
      - 'xpi.lib.zsh'
      - 'xomp.lib.zsh'
      - 'xopencode.lib.zsh'
      - 'xsandbox.lib.zsh'
      - 'test_xclaude.bash'
      - 'test_trust_gate.zsh'
      - 'test_sandbox.zsh'
      - 'test_xcodex_sandbox.zsh'
      - 'test_xpi_sandbox.zsh'
      - 'test_xomp_sandbox.zsh'
      - 'test_xopencode_sandbox.zsh'
      - 'toolchains/postgres.sb'
      - 'toolchains/postgres.test.zsh'
      - 'toolchains/metal.sb'
      - 'toolchains/metal.test.zsh'
      - 'toolchains/test_helpers.zsh'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'base.sb'
      - 'base-common.sb'
      - 'base-codex.sb'
      - 'base-pi.sb'
      - 'base-omp.sb'
      - 'base-opencode.sb'
      - 'xclaude'
      - 'xcodex'
      - 'xpi'
      - 'xomp'
      - 'xopencode'
      - 'xclaude.lib.zsh'
      - 'xcodex.lib.zsh'
      - 'xpi.lib.zsh'
      - 'xomp.lib.zsh'
      - 'xopencode.lib.zsh'
      - 'xsandbox.lib.zsh'
      - 'test_xclaude.bash'
      - 'test_trust_gate.zsh'
      - 'test_sandbox.zsh'
      - 'test_xcodex_sandbox.zsh'
      - 'test_xpi_sandbox.zsh'
      - 'test_xomp_sandbox.zsh'
      - 'test_xopencode_sandbox.zsh'
      - 'toolchains/postgres.sb'
      - 'toolchains/postgres.test.zsh'
      - 'toolchains/metal.sb'
      - 'toolchains/metal.test.zsh'
      - 'toolchains/test_helpers.zsh'
      - '.github/workflows/test.yml'

jobs:
  dsl-tests:
    name: DSL pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash test_xclaude.bash

  trust-gate:
    name: Trust gate integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: zsh test_trust_gate.zsh

  sandbox-base:
    name: "Sandbox: base profile"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: zsh test_sandbox.zsh --toolchain none

  sandbox-codex:
    name: "Sandbox: Codex base profile"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: zsh test_xcodex_sandbox.zsh

  sandbox-pi:
    name: "Sandbox: Pi base profile"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: zsh test_xpi_sandbox.zsh

  sandbox-omp:
    name: "Sandbox: Oh My Pi base profile"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://omp.sh/install | sh -s -- --binary
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: zsh test_xomp_sandbox.zsh

  sandbox-opencode:
    name: "Sandbox: OpenCode base profile"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path
      - run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - run: zsh test_xopencode_sandbox.zsh

  sandbox-postgres:
    name: "Sandbox toolchain: PostgreSQL"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install postgresql@17
      - run: zsh test_sandbox.zsh --toolchain postgres

  sandbox-metal:
    name: "Sandbox toolchain: Metal"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: zsh test_sandbox.zsh --toolchain metal
